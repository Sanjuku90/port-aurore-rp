# Blueprint Render : service Node.js (comptes, e-mails, sauvegarde cloud, cadeaux) + disque persistant.
# Le disque persistant nécessite une offre payante Render (Starter ou plus).
services:
  - type: web
    name: port-aurore-rp
    runtime: node
    plan: starter
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: port-aurore-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      # Facultatif (mot de passe oublié par e-mail) : MAIL_FROM + RESEND_API_KEY ou BREVO_API_KEY
    pullRequestPreviewsEnabled: false
